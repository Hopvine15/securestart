[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }

jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.8.0"
